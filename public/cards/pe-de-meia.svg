<title id="title">Pé-de-Meia: apoio à permanência no ensino médio</title>
<desc id="desc">O programa de incentivo financeiro-educacional busca apoiar estudantes do ensino médio público na continuidade e conclusão dos estudos. Fonte: Ministério da Educação. https://www.gov.br/mec/pt-br/pe-de-meia. Card original da iniciativa independente Todos com Lula.</desc>

name: Processar revisão da administração
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Validar a fila privada sem coletar ou publicar'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: admin-processing-todos-com-lula
  cancel-in-progress: false
jobs:
  process:
    if: github.event_name == 'workflow_dispatch' || vars.ADMIN_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: instagram-publishing
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Validar a implementação da administração
        run: node --test tests/admin.test.mjs
      - name: Verificar a fila privada
        if: inputs.check_only
        env:
          ADMIN_BLOB_READ_WRITE_TOKEN: ${{ secrets.ADMIN_BLOB_READ_WRITE_TOKEN }}
          ADMIN_VERCEL_TOKEN: ${{ secrets.ADMIN_VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: node scripts/admin/worker.mjs --check
      - name: Preparar ferramentas para os vídeos aprovados
        if: '!inputs.check_only'
        shell: bash
        run: |
          set -euo pipefail
          task_tool_dir="$RUNNER_TEMP/admin-gitleaks"
          mkdir -p "$task_tool_dir" .git/tools
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$task_tool_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$task_tool_dir/gitleaks_8.30.1_checksums.txt"
          (cd "$task_tool_dir" && sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt)
          tar -xzf "$task_tool_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C .git/tools gitleaks
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          npx playwright install --with-deps chromium
      - name: Coletar para revisão e publicar somente os aprovados
        if: '!inputs.check_only'
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_BLOB_READ_WRITE_TOKEN: ${{ secrets.ADMIN_BLOB_READ_WRITE_TOKEN }}
          ADMIN_WORKER_SECRET: ${{ secrets.ADMIN_WORKER_SECRET }}
          ADMIN_VERCEL_TOKEN: ${{ secrets.ADMIN_VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: node scripts/admin/worker.mjs

name: Configurar publicação do Instagram na Vercel
on:
  workflow_dispatch:
    inputs:
      native_mode:
        description: 'Pausar ou retomar temporariamente a fila nativa durante o lote manual'
        type: choice
        options: [keep, pause, resume]
        default: keep
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: instagram-publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configurar credenciais protegidas no projeto autorizado
        env:
          ADMIN_VERCEL_TOKEN: ${{ secrets.ADMIN_VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          ADMIN_WORKER_SECRET: ${{ secrets.ADMIN_WORKER_SECRET }}
          INSTAGRAM_NATIVE_PAUSED: ${{ inputs.native_mode == 'pause' && 'true' || inputs.native_mode == 'resume' && 'false' || '' }}
        run: node scripts/admin/configure-instagram-vercel.mjs

name: Instagram — lote manual aprovado
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar somente os vídeos revisados em instagram-manual-batch.json'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: instagram-manual-boraaalula2026
  cancel-in-progress: false
jobs:
  manual:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: instagram-publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Validar publicador e retomada sem duplicidade
        run: node --test tests/instagram-manual.test.mjs tests/instagram-vercel.test.mjs scripts/test-instagram-publishing.mjs
      - name: Preparar verificação dos checkpoints públicos
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          task_scan_dir="$RUNNER_TEMP/instagram-manual-gitleaks"
          mkdir -p "$task_scan_dir" .git/tools
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$task_scan_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$task_scan_dir/gitleaks_8.30.1_checksums.txt"
          (cd "$task_scan_dir" && sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt)
          tar -xzf "$task_scan_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C .git/tools gitleaks
      - name: Conferir ou publicar o lote autorizado
        env:
          PUBLIC_SITE_URL: https://todos-com-lula.vercel.app
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          ADMIN_BLOB_READ_WRITE_TOKEN: ${{ secrets.ADMIN_BLOB_READ_WRITE_TOKEN }}
          ADMIN_WORKER_SECRET: ${{ secrets.ADMIN_WORKER_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/instagram-manual.mjs ${{ inputs.publish && '--publish' || '--check' }}
